<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - FocusUp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <div id="navbar"></div>

    <main class="page-container">
        <section class="page-heading">
            <p class="eyebrow">Conta pessoal</p>
            <h1>Perfil do utilizador</h1>
            <p>Consulta e atualiza os teus dados pessoais.</p>
        </section>

        <section class="cards-grid two-columns">
            <article class="card profile-card">
                <div id="profilePhotoPreview" class="profile-photo-placeholder">FU</div>
                <h2 id="profileDisplayName">Utilizador</h2>
                <p id="profileEmail">email</p>
                <p id="profileBioText">Ainda sem bio.</p>
            </article>

            <article class="card">
                <h2>Editar perfil</h2>
                <form id="profileForm" class="form-card">
                    <label for="profileNameInput">Nome</label>
                    <input type="text" id="profileNameInput" required>

                    <label for="profileBioInput">Bio</label>
                    <textarea id="profileBioInput" rows="4" placeholder="Escreve uma pequena descrição sobre ti"></textarea>

                    <label for="profilePhotoInput">Foto de perfil por URL</label>
                    <input type="url" id="profilePhotoInput" placeholder="https://...">

                    <label for="profilePhotoFile">Ou carregar imagem</label>
                    <input type="file" id="profilePhotoFile" accept="image/*">

                    <p id="profileMessage" class="message" aria-live="polite"></p>

                    <div class="button-row">
                        <button type="submit">Guardar perfil</button>
                        <button type="button" id="logoutBtn" class="danger-button">Encerrar sessão</button>
                    </div>
                </form>
            </article>
        </section>
    </main>

    <script type="module" src="../js/view/profileView.js"></script>
</body>
</html>
