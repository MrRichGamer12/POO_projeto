<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas - Foflux</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <div id="navbar"></div>

    <main class="page-container">
        <section class="page-heading">
            <p class="eyebrow">Organização pessoal</p>
            <h1>Bloco de Notas</h1>
            <p>Guarda ideias rápidas, apontamentos de estudo, lembretes e pensamentos importantes sem sair da aplicação.</p>
        </section>

        <section class="cards-grid two-columns notes-layout">
            <article class="card notes-form-card">
                <h2 id="noteFormTitle">Nova nota</h2>
                <form id="noteForm" class="form-card">
                    <input type="hidden" id="noteId">

                    <label for="noteTitle">Título</label>
                    <input type="text" id="noteTitle" placeholder="Ex.: Ideias para estudar POO" required>

                    <label for="noteContent">Conteúdo</label>
                    <textarea id="noteContent" rows="8" placeholder="Escreve aqui a tua nota..."></textarea>

                    <p id="noteMessage" class="message" aria-live="polite"></p>

                    <div class="button-row">
                        <button type="submit">Guardar nota</button>
                        <button type="button" id="cancelNoteEditBtn" class="secondary-button">Cancelar edição</button>
                    </div>
                </form>
            </article>

            <article class="card notes-list-card">
                <div class="section-title-row">
                    <div>
                        <h2>As minhas notas</h2>
                        <p class="text-muted mb-0">Pesquisa por título ou conteúdo.</p>
                    </div>
                </div>
                <input type="search" id="noteSearch" placeholder="Pesquisar notas..." class="mb-3">
                <div id="notesList" class="notes-list"></div>
            </article>
        </section>
    </main>

    <script type="module" src="../js/view/notesView.js"></script>
</body>
</html>
