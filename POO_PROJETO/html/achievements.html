<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquistas - FocusUp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <div id="navbar"></div>

    <main class="page-container">
        <section class="page-heading">
            <p class="eyebrow">Gamificação</p>
            <h1>Badges, Troféus e Conquistas</h1>
            <p>Vê o que já desbloqueaste e o que falta fazer para completar o progresso.</p>
        </section>

        <section class="stats-box">
            <article class="stat-card">
                <h3>Desbloqueadas</h3>
                <p id="unlockedCount">0</p>
            </article>
            <article class="stat-card">
                <h3>Bloqueadas</h3>
                <p id="lockedCount">0</p>
            </article>
            <article class="stat-card">
                <h3>Progresso</h3>
                <p id="achievementProgress">0%</p>
            </article>
        </section>

        <section class="cards-grid two-columns">
            <article class="card">
                <h2>Conquistas desbloqueadas</h2>
                <div id="unlockedBadges" class="achievement-list"></div>
            </article>

            <article class="card">
                <h2>Conquistas em progresso</h2>
                <div id="lockedBadges" class="achievement-list"></div>
            </article>
        </section>
    </main>

    <script type="module" src="../js/view/achievementView.js"></script>
</body>
</html>
