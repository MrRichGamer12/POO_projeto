<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração - FocusUp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <div id="navbar"></div>

    <main class="page-container">
        <section class="page-heading">
            <p class="eyebrow">Modo administrador</p>
            <h1>Gestão de utilizadores</h1>
            <p>Área reservada a administradores para visualizar, editar e remover utilizadores.</p>
        </section>

        <section class="stats-box">
            <article class="stat-card">
                <h3>Utilizadores</h3>
                <p id="adminUsersCount">0</p>
            </article>
            <article class="stat-card">
                <h3>Sessões totais</h3>
                <p id="adminFocusCount">0</p>
            </article>
            <article class="stat-card">
                <h3>Tarefas totais</h3>
                <p id="adminTaskCount">0</p>
            </article>
        </section>

        <section class="card table-card">
            <h2>Todos os utilizadores registados</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Bio</th>
                            <th>Sessões</th>
                            <th>Tarefas</th>
                            <th>Conquistas</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>
            <p id="adminMessage" class="message" aria-live="polite"></p>
        </section>
    </main>

    <script type="module" src="../js/view/adminView.js"></script>
</body>
</html>
