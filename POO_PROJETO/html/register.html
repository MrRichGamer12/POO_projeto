<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo - FocusUp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="auth-page">

    <main class="auth-layout">
        <section class="auth-card">
            <a class="brand auth-brand" href="../index.html">FocusUp</a>
            <h1>Criar conta</h1>
            <p>Cria a tua conta para guardar progresso, tarefas e conquistas.</p>

            <form id="registerForm" class="form-card">
                <label for="name">Nome</label>
                <input type="text" id="name" placeholder="O teu nome" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Mínimo 4 caracteres" required>

                <label for="confirmPassword">Confirmar password</label>
                <input type="password" id="confirmPassword" placeholder="Repete a password" required>

                <p id="authMessage" class="message" aria-live="polite"></p>

                <button type="submit" class="btn full-width">Registar</button>
            </form>

            <p class="auth-switch">
                Já tens conta?
                <a id="loginLink" href="login.html">Faz login aqui.</a>
            </p>
        </section>
    </main>

    <script type="module" src="../js/view/authView.js"></script>
</body>
</html>
