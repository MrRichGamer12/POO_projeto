<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Foflux</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="auth-page">

    <main class="auth-layout">
        <section class="auth-card">
            <a class="brand auth-brand" href="../index.html">Foflux</a>
            <h1>Entrar</h1>
            <p>Inicia sessão para aceder às tuas tarefas, sessões de foco e conquistas.</p>

            <form id="loginForm" class="form-card">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="A tua password" required>

                <p id="authMessage" class="message" aria-live="polite"></p>

                <button type="submit" class="btn full-width">Entrar</button>
            </form>

            <p class="auth-switch">
                Ainda não tens conta?
                <a id="registerLink" href="register.html">Regista-te aqui.</a>
            </p>
        </section>
    </main>

    <script type="module" src="../js/view/authView.js"></script>
</body>
</html>
